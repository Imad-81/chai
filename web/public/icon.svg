<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.4" />
  
  <!-- Stylized Steaming Cup / Agent Core -->
  <path d="M140 220 C140 330 200 380 256 380 C312 380 372 330 372 220 Z" fill="url(#grad)" filter="url(#glow)" opacity="0.9" />
  
  <!-- Cup Handle -->
  <path d="M360 230 C420 230 430 320 350 330" fill="none" stroke="url(#grad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Steam / Waves -->
  <path d="M210 170 Q225 140 210 110" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />
  <path d="M256 160 Q275 130 256 95" fill="none" stroke="#818cf8" stroke-width="16" stroke-linecap="round" />
  <path d="M302 170 Q317 140 302 110" fill="none" stroke="#ec4899" stroke-width="16" stroke-linecap="round" />
</svg>
